<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- 4 cards -->
  <rect x="3" y="3.5" width="12" height="11" rx="3" fill="#fff" opacity="0.95"/>
  <rect x="17" y="3.5" width="12" height="11" rx="3" fill="#fff" opacity="0.92"/>
  <rect x="3" y="17.5" width="12" height="11" rx="3" fill="#fff" opacity="0.88"/>
  <rect x="17" y="17.5" width="12" height="11" rx="3" fill="#fff" opacity="0.84"/>

  <!-- Color accents — left edge dots -->
  <circle cx="6" cy="6.5" r="2.2" fill="#f97316"/>
  <circle cx="20" cy="6.5" r="2.2" fill="#17a34a"/>
  <circle cx="6" cy="20.5" r="2.2" fill="#7c3aed"/>
  <circle cx="20" cy="20.5" r="2.2" fill="#dc2626"/>

  <!-- Subtle horizontal lines in each card -->
  <line x1="9.5" y1="6.5" x2="13" y2="6.5" stroke="#e5e5e5" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23.5" y1="6.5" x2="27" y2="6.5" stroke="#e5e5e5" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9.5" y1="20.5" x2="13" y2="20.5" stroke="#e5e5e5" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23.5" y1="20.5" x2="27" y2="20.5" stroke="#e5e5e5" stroke-width="1.2" stroke-linecap="round"/>
</svg>
