<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目管理看板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafafa;--surface:#fff;--fg:#111;--muted:#6b6b6b;
  --border:#e5e5e5;--accent:#2f6feb;--accent-on:#fff;
  --accent-hover:#2558d4;--success:#17a34a;--warn:#eab308;--danger:#dc2626;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --radius-sm:8px;--radius-md:12px;
  --elev-raised:0 2px 8px rgba(0,0,0,.08);
  --motion:150ms;
}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px}
.brand{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--fg)}
.brand svg{display:block}
.nav-pills{display:flex;gap:4px;margin-left:auto}
.nav-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--muted);transition:all var(--motion);cursor:pointer;border:1px solid transparent}
.nav-pill svg{display:block}
.nav-pill:hover{color:var(--fg);background:var(--bg)}
.nav-pill.active{color:var(--accent);background:#eef3ff;border-color:#c4d7fb}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 0}
.toolbar-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;gap:4px}
.filter-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);border:1px solid transparent;transition:all var(--motion);cursor:pointer}
.filter-btn svg{display:block}
.filter-btn:hover{color:var(--fg)}
.filter-btn.active{color:var(--accent);background:#eef3ff;border-color:#c4d7fb}
.priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.priority-dot.urgent{background:var(--danger)}
.priority-dot.high{background:var(--warn)}
.priority-dot.low{background:var(--success)}
.filter-divider{width:1px;height:24px;background:var(--border)}
.search-wrap{position:relative;margin-left:auto}
.search-input{width:170px;padding:7px 36px 7px 34px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--fg);transition:all 200ms;outline:none}
.search-input:focus{width:220px;border-color:var(--accent);background:var(--surface)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all var(--motion);cursor:pointer;border:none;background:none}
.search-clear:hover{background:var(--border);color:var(--fg)}
.export-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted);border:1px solid var(--border);transition:all var(--motion);cursor:pointer}
.export-btn svg{display:block}
.export-btn:hover{color:var(--fg);border-color:var(--fg)}
.add-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-on);font-size:13px;font-weight:500;transition:all var(--motion);cursor:pointer;border:none}
.add-btn:hover{background:var(--accent-hover)}

/* BOARD */
.board{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;min-height:calc(100vh - 130px)}
.col{background:var(--bg);border-radius:var(--radius-md);display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:hidden;transition:border-color var(--motion)}
.col.drag-over{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(47,111,235,.12)}
.col-header{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-shrink:0}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.col-title{font-size:13px;font-weight:600;color:var(--fg)}
.col-count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--border);padding:2px 7px;border-radius:10px}
.col-cards{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.col-cards::-webkit-scrollbar{width:4px}
.col-cards::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.col-empty{text-align:center;color:var(--muted);font-size:13px;padding:32px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.col-empty svg{color:var(--border);display:block}
.col-new-card{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:13px;cursor:pointer;transition:all var(--motion);flex-shrink:0}
.col-new-card:hover{border-color:var(--accent);color:var(--accent)}

/* CARDS */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;cursor:grab;transition:all var(--motion);position:relative;display:flex;flex-direction:column;gap:6px}
.task-card:hover{box-shadow:var(--elev-raised)}
.task-card.dragging{opacity:.5;transform:rotate(2deg);cursor:grabbing}
.task-card.overdue-card{border-color:#fecaca;background:#fef2f2}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-title{font-size:13px;font-weight:500;color:var(--fg);flex:1;line-height:1.4}
.card-actions{position:absolute;top:8px;right:8px;width:26px;height:26px;display:none;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);cursor:pointer;border:none;background:none;transition:all var(--motion)}
.task-card:hover .card-actions{display:flex}
.card-actions:hover{background:var(--bg);color:var(--fg)}
.priority-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0}
.priority-badge.urgent{background:#fef2f2;color:var(--danger)}
.priority-badge.high{background:#fefce8;color:#a16207}
.priority-badge.low{background:#f0fdf4;color:var(--success)}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.meta-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.meta-tag svg{display:block}
.subtask-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.subtask-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.overdue-warn{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--danger);font-weight:500}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px}
.modal{background:var(--surface);border-radius:var(--radius-md);width:100%;max-width:580px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--elev-raised)}
.modal-header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:18px;font-weight:600;flex:1}
.modal-close{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border:none;background:none;transition:all var(--motion)}
.modal-close:hover{background:var(--bg);color:var(--fg);display:block}
.modal-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
.modal-tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;position:relative;transition:all var(--motion)}
.modal-tab.active{color:var(--accent)}
.modal-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent)}
.modal-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all var(--motion);cursor:pointer;border:1px solid var(--border)}
.btn-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{color:var(--fg)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}

/* FORM */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--fg)}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--fg);transition:all var(--motion);font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px}
.field select{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* SUBTASK */
.subtask-list{display:flex;flex-direction:column;gap:6px}
.subtask-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-sm);transition:all var(--motion)}
.subtask-item input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.subtask-item input[type="text"]{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--fg)}
.subtask-item input[type="text"]:focus{outline:none;border-color:var(--accent)}
.subtask-item.completed input[type="text"]{text-decoration:line-through;color:var(--muted)}
.subtask-delete{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);cursor:pointer;border:none;background:none;transition:all var(--motion);flex-shrink:0}
.subtask-delete:hover{background:#fef2f2;color:var(--danger)}
.subtask-add{display:flex;align-items:center;gap:6px;padding:8px 10px;color:var(--accent);font-size:13px;cursor:pointer;border:none;background:none;transition:all var(--motion)}
.subtask-add:hover{opacity:.8}

/* COMMENTS */
.comment-list{display:flex;flex-direction:column;gap:12px}
.comment-item{display:flex;flex-direction:column;gap:4px}
.comment-header{display:flex;align-items:center;gap:8px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.comment-meta{font-size:12px;color:var(--muted)}
.comment-text{font-size:13px;color:var(--fg);line-height:1.5;padding-left:36px}
.comment-input-row{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--border)}
.comment-input-row textarea{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--fg);resize:vertical;min-height:60px;font-family:inherit}
.comment-input-row textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* DASHBOARD */
.dashboard{padding:24px;max-width:1400px;margin:0 auto}
.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;gap:6px;transition:all var(--motion)}
.stat-card:hover{box-shadow:var(--elev-raised)}
.stat-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px}
.stat-value{font-size:32px;font-weight:700;color:var(--fg);line-height:1}
.stat-sub{font-size:12px;color:var(--muted)}
.stat-card.danger{background:#fff5f5;border-color:#fecaca}
.stat-card.danger .stat-value{color:var(--danger)}
.stat-card.success .stat-value{color:var(--success)}
.stat-card.warn .stat-value{color:var(--warn)}
.stat-card.accent{background:#f0f7ff;border-color:#c4d7fb}
.stat-card.accent .stat-value{color:var(--accent)}
.dashboard-panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.panel-header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-size:14px;font-weight:600;color:var(--fg)}
.panel-title svg{display:block}
.panel-body{padding:16px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.overdue-item{padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg);display:flex;flex-direction:column;gap:4px}
.overdue-item-title{font-size:13px;font-weight:500;color:var(--fg);display:flex;align-items:center;gap:8px}
.overdue-days{font-size:11px;font-weight:600;color:var(--danger);background:#fef2f2;padding:2px 6px;border-radius:4px}
.overdue-meta{font-size:12px;color:var(--muted)}
.col-bar-item{display:flex;flex-direction:column;gap:4px}
.col-bar-header{display:flex;align-items:center;justify-content:space-between}
.col-bar-name{font-size:13px;color:var(--fg);display:flex;align-items:center;gap:6px}
.col-bar-count{font-size:12px;color:var(--muted);font-weight:600}
.col-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.col-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.team-list{display:flex;flex-direction:column;gap:10px}
.team-member{display:flex;align-items:center;gap:10px}
.team-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--surface);flex-shrink:0}
.team-info{flex:1;display:flex;flex-direction:column;gap:3px}
.team-name{font-size:13px;font-weight:500;color:var(--fg)}
.team-tasks{font-size:11px;color:var(--muted)}
.team-bar-wrap{width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.team-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}

/* REPORT */
.report{padding:24px;max-width:1400px;margin:0 auto;overflow-x:auto}
.report table{width:100%;border-collapse:collapse;font-size:13px}
.report th{text-align:left;padding:10px 12px;background:var(--bg);color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
.report td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--fg);vertical-align:middle}
.report tr:hover td{background:var(--bg)}
.report .overdue-row td{color:var(--danger);font-weight:500}
.priority-cell{display:inline-flex;align-items:center;gap:4px}

/* UTILS */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-source-internal{background:#f0fdf4;color:#166534}
.badge-source-external{background:#eff6ff;color:#1e40af}
.badge-source-mine{background:#f5f3ff;color:#5b21b6}
.badge-empty{background:var(--bg);color:var(--muted)}
.text-muted{color:var(--muted)}
.text-xs{font-size:12px}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.fade-in{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>

// ── UTILS ──
function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.tasks = parsed.tasks || INIT_TASKS;
      return;
    }
  } catch(e) {}
  state.tasks = INIT_TASKS;
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks: state.tasks}));
}

function generateId() {
  return 't' + Date.now();
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function overdueDays(due) {
  if (!due) return 0;
  const diff = new Date(today()) - new Date(due);
  return Math.ceil(diff / 86400000);
}

function isOverdue(task) {
  return overdueDays(task.due) > 0 && task.col !== 'done';
}

function formatDue(due) {
  if (!due) return '';
  const days = overdueDays(due);
  if (days > 0) return due + ' · 逾期';
  return due;
}

function subtext(task) {
  if (!task.subtasks || task.subtasks.length === 0) return null;
  const done = task.subtasks.filter(s => s.done).length;
  const total = task.subtasks.length;
  return {done, total};
}

function avatarColor(name) {
  const colors = ['#2f6feb','#7c3aed','#db2777','#059669','#d97706','#0284c7'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function avatarName(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  return parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : name.slice(0, 2);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function matchesFilter(task) {
  const f = state.filter;
  if (f.source !== 'all' && task.source !== f.source) return false;
  if (f.priority !== 'all' && task.priority !== f.priority) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const match = task.title.toLowerCase().includes(q) ||
      (task.desc && task.desc.toLowerCase().includes(q)) ||
      (task.assignee && task.assignee.toLowerCase().includes(q));
    if (!match) return false;
  }
  return true;
}

function filteredTasks() {
  return state.tasks.filter(matchesFilter);
}

function colTasks(colId) {
  return filteredTasks().filter(t => t.col === colId);
}

function taskCount(colId) {
  return colTasks(colId).length;
}

function totalTasks() { return state.tasks.length; }
function doneTasks() { return state.tasks.filter(t => t.col === 'done').length; }
function progressTasks() { return state.tasks.filter(t => t.col === 'inprogress' || t.col === 'review').length; }
function blockedTasks() { return state.tasks.filter(t => t.col === 'blocked').length; }
function overdueTasks() { return state.tasks.filter(t => isOverdue(t)); }
function doneRate() { return totalTasks() ? Math.round(doneTasks() / totalTasks() * 100) : 0; }

function renderColumn(col) {
  const tasks = colTasks(col.id);
  const count = tasks.length;
  return `
  <div class="col" id="col-${col.id}" ondragover="onDragOver(event,'${col.id}')" ondrop="onDrop(event,'${col.id}')" ondragleave="onDragLeave(event)">

      <span class="col-title">${col.name}</span>
      <span class="col-count">${count}</span>
    </div>
    <div class="col-cards">
      ${tasks.length === 0 ? `<div class="col-empty">${ICONS.grid}<span>暂无任务</span></div>` : ''}

    <div class="col-new-card" onclick="openNewTask('${col.id}')">${ICONS.plus}<span>添加任务</span></div>

function renderCard(task) {
  const overdue = isOverdue(task);
  const subs = subtext(task);
  const commentCount = task.comments ? task.comments.length : 0;
  const priorityClass = task.priority;
  const sourceClass = task.source === 'external' ? 'external' : task.source === 'mine' ? 'mine' : 'internal';
  const overdueClass = overdue ? 'overdue-card' : '';
  return `
  <div class="task-card ${overdueClass}" id="card-${task.id}" draggable="true"
    ondragstart="onDragStart(event,'${task.id}')"
    ondragend="onDragEnd(event)"
    onclick="openEditTask('${task.id}')">
    <div class="card-top">
      <span class="card-title">${escapeHtml(task.title)}</span>
      <button class="card-actions" onclick="event.stopPropagation();openEditTask('${task.id}')">${ICONS.edit}</button>
    </div>
    <div>
      <span class="priority-badge ${priorityClass}">${PRIORITY_MAP[task.priority]}</span>
      <span class="badge badge-source-${sourceClass}">${SOURCE_MAP[task.source]}</span>
    </div>
    ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ''}
    ${overdue ? `<div class="overdue-warn">${ICONS.warning}<span>已逾期 ${overdueDays(task.due)} 天</span></div>` : ''}
    <div class="card-meta">
      ${task.due ? `<span class="meta-tag">${ICONS.calendar}<span class="${overdue?'text-danger':''}">${formatDue(task.due)}</span></span>` : ''}
      ${task.assignee ? `<span class="meta-tag">${ICONS.user}<span>${escapeHtml(task.assignee)}</span></span>` : ''}
      ${subs ? `
        <span class="meta-tag" title="子任务">${ICONS.checkSquare}<span>${subs.done}/${subs.total}</span></span>
        <div class="subtask-bar"><div class="subtask-fill" style="width:${Math.round(subs.done/subs.total*100)}%"></div></div>
      ` : ''}
      ${commentCount > 0 ? `<span class="meta-tag">${ICONS.comment}<span>${commentCount}</span></span>` : ''}
    </div>
  </div>`;
}

                  <span class="overdue-days">逾期 ${days} 天</span>
                </div>
                <div class="overdue-meta">${col ? col.name : ''} · ${escapeHtml(t.assignee || '未分配')} · 截止 ${t.due}</div>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">${ICONS.bar}<span class="panel-title">列分布</span></div>
        <div class="panel-body">
          ${COLUMNS.map(col => {
            const ctasks = state.tasks.filter(t => t.col === col.id);
            const maxCount = Math.max(...COLUMNS.map(c => state.tasks.filter(t => t.col === c.id).length), 1);
            const pct = Math.round(ctasks.length / maxCount * 100);
            return `
            <div class="col-bar-item">
              <div class="col-bar-header">
                <span class="col-bar-name"><span class="col-dot" style="background:${col.color}"></span>${col.name}</span>
                <span class="col-bar-count">${ctasks.length}</span>
              </div>
              <div class="col-bar"><div class="col-bar-fill" style="width:${pct}%;background:${col.color}"></div></div>
            </div>`;
          }).join('')}
          <div style="margin-top:16px">
            <div class="panel-title" style="margin-bottom:10px">${ICONS.user}人员负载</div>
            ${MEMBERS.map(mem => {
              const memTasks = state.tasks.filter(t => t.assignee === mem);
              const memInProg = memTasks.filter(t => t.col === 'inprogress' || t.col === 'review').length;
              const pct = memTasks.length > 0 ? Math.min(100, Math.round(memInProg / memTasks.length * 100)) : 0;
              const barColor = pct >= 70 ? '#dc2626' : pct >= 40 ? '#eab308' : '#17a34a';
              return `
              <div class="team-member">
                <div class="team-avatar" style="background:${avatarColor(mem)}">${avatarName(mem)}</div>
                <div class="team-info">
                  <div class="team-name">${escapeHtml(mem)} <span class="text-muted text-xs">${memTasks.length} 个任务</span></div>
                  <div class="team-bar-wrap"><div class="team-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderReport() {
  const tasks = state.tasks;
  return `
  <div class="report fade-in">
    <table>
      <thead>
        <tr>
          <th>#</th><th>任务名称</th><th>来源</th><th>优先级</th><th>状态</th><th>负责人</th><th>截止日期</th><th>子任务</th><th>备注</th>
        </tr>
      </thead>
      <tbody>
        ${tasks.map((t,i) => {
          const col = COLUMNS.find(c => c.id === t.col);
          const overdue = isOverdue(t);
          const subs = subtext(t);
          const priorityClass = t.priority;
          const sourceClass = t.source === 'external' ? 'external' : t.source === 'mine' ? 'mine' : 'internal';
          return `
          <tr class="${overdue?'overdue-row':''}">
            <td>${i+1}</td>
            <td><strong>${escapeHtml(t.title)}</strong></td>
            <td><span class="badge badge-source-${sourceClass}">${SOURCE_MAP[t.source]}</span></td>
            <td><span class="priority-badge ${priorityClass}">${PRIORITY_MAP[t.priority]}</span></td>
            <td><span style="color:${col?col.color:'#999'};font-weight:600">${col?col.name:''}</span></td>
            <td>${escapeHtml(t.assignee || '—')}</td>
            <td class="${overdue?'text-danger':'text-muted'}">${t.due || '—'}</td>
            <td>${subs ? `${subs.done}/${subs.total}` : '—'}</td>
            <td>${t.comments&&t.comments.length>0?t.comments.length+'条':'—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderModal() {
  const task = state.editingTask;
  const isNew = !task.id;
  const title = isNew ? '新建任务' : '编辑任务';
  const tab = state.modalTab;
  return `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal fade-in" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">${title}</span>
        <button class="modal-close" onclick="closeModal()">${ICONS.x}</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab ${tab==='info'?'active':''}" onclick="setModalTab('info')">基本信息</button>
        <button class="modal-tab ${tab==='subtasks'?'active':''}" onclick="setModalTab('subtasks')">子任务 ${task.subtasks&&task.subtasks.length>0?'('+task.subtasks.length+')':''}</button>
        <button class="modal-tab ${tab==='comments'?'active':''}" onclick="setModalTab('comments')">备注 ${task.comments&&task.comments.length>0?'('+task.comments.length+')':''}</button>
      </div>
      <div class="modal-body">
        ${tab === 'info' ? renderTabInfo() : ''}
        ${tab === 'subtasks' ? renderTabSubtasks() : ''}
        ${tab === 'comments' ? renderTabComments() : ''}
      </div>
      <div class="modal-footer">
        ${!isNew ? `<button class="btn btn-danger" onclick="deleteTask('${task.id}')">${ICONS.trash}<span>删除</span></button>` : ''}
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveTask()">${ICONS.check}<span>保存</span></button>
      </div>
    </div>
  </div>`;
}

function renderTabInfo() {
  const task = state.editingTask;
  return `
  <div class="field">
    <label>任务名称 *</label>
    <input id="task-title" value="${escapeHtml(task.title||'')}" placeholder="简要描述任务内容">
  </div>
  <div class="field">
    <label>详细描述</label>
    <textarea id="task-desc" placeholder="补充说明、验收标准等">${escapeHtml(task.desc||'')}</textarea>
  </div>
  <div class="form-row">
    <div class="field">
      <label>负责人</label>
      <select id="task-assignee">
        <option value="">请选择</option>
        ${MEMBERS.map(m => `<option value="${escapeHtml(m)}" ${task.assignee===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>截止日期</label>
      <input type="date" id="task-due" value="${task.due||''}">
    </div>
  </div>
  <div class="form-row">
    <div class="field">
      <label>优先级</label>
      <select id="task-priority">
        ${PRIORITIES.map(p => `<option value="${p}" ${task.priority===p?'selected':''}>${PRIORITY_MAP[p]}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>来源</label>
      <select id="task-source">
        ${SOURCES.map(s => `<option value="${s}" ${task.source===s?'selected':''}>${SOURCE_MAP[s]}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="field">
      <label>状态</label>
      <select id="task-col">
        ${COLUMNS.map(c => `<option value="${c.id}" ${task.col===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>标签</label>
      <input id="task-tags" value="${escapeHtml(task.tags||'')}" placeholder="标签，用逗号分隔">
    </div>
  </div>`;
}

function renderTabSubtasks() {
  const subs = state.editingTask.subtasks || [];
  return `
  <div class="subtask-list">
    ${subs.length === 0 ? '<div class="text-muted text-xs">暂无子任务，点击下方添加</div>' : ''}
    ${subs.map((s,i) => `
    <div class="subtask-item ${s.done?'completed':''}">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask(${i})">
      <input type="text" value="${escapeHtml(s.text)}" onchange="updateSubtaskText(${i},this.value)">
      <button class="subtask-delete" onclick="deleteSubtask(${i})">${ICONS.x}</button>
    </div>`).join('')}
  </div>
  <button class="subtask-add" onclick="addSubtask()">${ICONS.plus}<span>添加子任务</span></button>`;
}

function renderTabComments() {
  const comments = state.editingTask.comments || [];
  return `
  <div class="comment-list">
    ${comments.length === 0 ? '<div class="text-muted text-xs">暂无备注</div>' : ''}
    ${comments.map((c,i) => `
    <div class="comment-item">
      <div class="comment-header">
        <div class="comment-avatar" style="background:${avatarColor(c.user)}">${avatarName(c.user)}</div>
        <span class="comment-meta">${escapeHtml(c.user)} · ${escapeHtml(c.time)}</span>
      </div>
      <div class="comment-text">${escapeHtml(c.text)}</div>
    </div>`).join('')}
  </div>
  <div class="comment-input-row">
    <textarea id="comment-text" placeholder="添加备注…"></textarea>
    <button class="btn btn-primary" onclick="addComment()" style="flex-shrink:0;height:60px">${ICONS.send}</button>
  </div>`;
}

// ── EVENTS ──
function attachEvents() {}

function setView(v) { state.view = v; renderApp(); }

function setFilter(key, val) {
  state.filter[key] = val;
  renderApp();
}

function setSearch(val) {
  state.search = val;
  renderApp();
}

function openNewTask(colId) {
  state.editingTask = {title:'',desc:'',assignee:'',priority:'high',source:'internal',col:colId||'todo',due:'',subtasks:[],comments:[],tags:''};
  state.modalTab = 'info';
  state.modal = 'new';
  renderApp();
}

function openEditTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  state.editingTask = JSON.parse(JSON.stringify(task));
  state.modalTab = 'info';
  state.modal = 'edit';
  renderApp();
}

function closeModal() {
  state.modal = null;
  state.editingTask = null;
  renderApp();
}

function setModalTab(tab) {
  state.modalTab = tab;
  renderApp();
}

function saveTask() {
  const t = state.editingTask;
  t.title = document.getElementById('task-title').value.trim();
  t.desc = document.getElementById('task-desc').value.trim();
  t.assignee = document.getElementById('task-assignee').value;
  t.due = document.getElementById('task-due').value;
  t.priority = document.getElementById('task-priority').value;
  t.source = document.getElementById('task-source').value;
  t.col = document.getElementById('task-col').value;
  t.tags = document.getElementById('task-tags').value.trim();
  if (!t.title) { alert('请填写任务名称'); return; }
  if (state.modal === 'new') {
    t.id = generateId();
    state.tasks.push(t);
  } else {
    const idx = state.tasks.findIndex(x => x.id === t.id);
    if (idx >= 0) state.tasks[idx] = t;
  }
  saveState();
  closeModal();
}

function deleteTask(id) {
  if (!confirm('确认删除该任务？')) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  closeModal();
}

// subtasks
function addSubtask() {
  if (!state.editingTask.subtasks) state.editingTask.subtasks = [];
  state.editingTask.subtasks.push({id:'s'+Date.now(),text:'',done:false});
  renderApp();
}
function toggleSubtask(idx) {
  state.editingTask.subtasks[idx].done = !state.editingTask.subtasks[idx].done;
  renderApp();
}
function updateSubtaskText(idx, val) {
  state.editingTask.subtasks[idx].text = val;
}
function deleteSubtask(idx) {
  state.editingTask.subtasks.splice(idx, 1);
  renderApp();
}

// comments
function addComment() {
  const text = document.getElementById('comment-text').value.trim();
  if (!text) return;
  if (!state.editingTask.comments) state.editingTask.comments = [];
  const now = new Date();
  const timeStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  state.editingTask.comments.push({user:'张明',text,time:timeStr});
  document.getElementById('comment-text').value = '';
  renderApp();
}

// drag & drop
function onDragStart(e, id) {
  state.dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.getElementById('card-'+id).classList.add('dragging'), 0);
}
function onDragEnd(e) {
  document.querySelectorAll('.task-card').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.col').forEach(el => el.classList.remove('drag-over'));
}
function onDragOver(e, colId) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.getElementById('col-'+colId).classList.add('drag-over');
}
function onDragLeave(e) {
  if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over');
  }
}
function onDrop(e, colId) {
  e.preventDefault();
  document.querySelectorAll('.col').forEach(el => el.classList.remove('drag-over'));
  if (!state.dragId) return;
  const idx = state.tasks.findIndex(t => t.id === state.dragId);
  if (idx >= 0) {
    state.tasks[idx].col = colId;
    saveState();
    renderApp();
  }
  state.dragId = null;
}

// export
function exportCSV() {
  const headers = ['任务名称','详细描述','来源','优先级','状态','负责人','截止日期','子任务数','子任务完成','备注数'];
  const rows = state.tasks.map(t => {
    const col = COLUMNS.find(c => c.id === t.col);
    const subs = subtext(t);
    return [
      t.title,t.desc||'',SOURCE_MAP[t.source]||'',PRIORITY_MAP[t.priority]||'',
      col?col.name:'',t.assignee||'',t.due||'',
      subs?subs.total:0,subs?subs.done:0,
      t.comments?t.comments.length:0
    ];
  });
  const csv = [headers,...rows].map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='任务清单.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ── BOOT ──
loadState();
renderApp();
</script>
